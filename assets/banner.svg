<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.4); opacity: 0.4; }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dash {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmer-move {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 0.95; filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.8)); }
      }
      @keyframes count-fade {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.75; }
      }

      .animated-chart-line {
        stroke-dasharray: 600;
        stroke-dashoffset: 0;
        animation: dash 3.5s ease-in-out infinite alternate;
      }
      .floating-card-1 {
        animation: float-slow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: float-reverse 5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-beacon {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse-dot 2s ease-in-out infinite;
      }
      .glow-title {
        animation: glow-pulse 4s ease-in-out infinite;
      }
      .shimmer-layer {
        animation: shimmer-move 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .badge-glow {
        animation: count-fade 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />
  <rect width="1200" height="380" rx="16" fill="url(#dots)" opacity="0.6" />

  <!-- Ambient Glow Blobs in Background -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="200" r="220" fill="#818cf8" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="350" r="160" fill="#c084fc" opacity="0.06" filter="url(#glow)" />

  <!-- Border Highlight -->
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Left Side: Branding & Title -->
  <g transform="translate(60, 50)">
    <!-- Top Pill / Status Tag -->
    <g class="badge-glow">
      <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="4.5" fill="#34d399" />
      <circle cx="16" cy="15" r="7" fill="#34d399" opacity="0.5" class="pulse-beacon" />
      <text x="32" y="19.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">LIVE ANALYTICS</text>
    </g>

    <!-- Project Title -->
    <g class="glow-title" transform="translate(0, 72)">
      <text fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
        GitHub Follower Tracker
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Track follower growth with daily snapshots, interactive insights &amp; SVG widgets.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="14" y="21.5" font-size="14">📸</text>
        <text x="38" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Daily Snapshots</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect width="165" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="14" y="21.5" font-size="14">📊</text>
        <text x="38" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Interactive Visuals</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(330, 0)">
        <rect width="155" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="14" y="21.5" font-size="14">🖼️</text>
        <text x="38" y="21.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">SVG Embeds</text>
      </g>
    </g>

    <!-- Terminal Quick Command Box -->
    <g transform="translate(0, 220)">
      <rect width="485" height="42" rx="8" fill="#090d13" stroke="#30363d" stroke-width="1" />
      <text x="16" y="26" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="600">$</text>
      <text x="36" y="26" fill="#f1f5f9" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13">npm run snapshot &amp;&amp; npm run dashboard</text>
      <circle cx="460" cy="21" r="3.5" fill="#34d399" />
    </g>
  </g>

  <!-- Right Side: Dynamic Interactive Dashboard Preview Card -->
  <g class="floating-card-1" transform="translate(680, 45)">
    <!-- Main Dashboard Card Window -->
    <rect width="460" height="290" rx="12" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#subtle-glow)" />

    <!-- Window Top Bar -->
    <rect width="460" height="36" rx="12" fill="#0f172a" fill-opacity="0.8" />
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#22c55e" opacity="0.8" />
    <text x="70" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">follower-insights.chart</text>

    <!-- Stat Metric 1 -->
    <g transform="translate(24, 52)">
      <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">TOTAL AUDIENCE</text>
      <text x="0" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">1,842</text>
      <rect x="80" y="21" width="56" height="20" rx="10" fill="url(#accent-green)" fill-opacity="0.2" stroke="#34d399" stroke-width="0.8" />
      <text x="90" y="34.5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">+14.2%</text>
    </g>

    <!-- Stat Metric 2 -->
    <g transform="translate(280, 52)">
      <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">NET GAIN (30D)</text>
      <text x="0" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">+128</text>
    </g>

    <!-- Mini Chart Grid Lines -->
    <g transform="translate(24, 115)">
      <line x1="0" y1="0" x2="412" y2="0" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.75" />
      <line x1="0" y1="40" x2="412" y2="40" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.75" />
      <line x1="0" y1="80" x2="412" y2="80" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.75" />
      <line x1="0" y1="120" x2="412" y2="120" stroke="#334155" stroke-width="1" />

      <!-- Area fill below chart line -->
      <path d="M 0 105 Q 60 95, 110 70 T 210 50 T 310 30 T 412 10 L 412 120 L 0 120 Z" fill="url(#chart-area)" />

      <!-- Dynamic Animated Main Chart Line -->
      <path d="M 0 105 Q 60 95, 110 70 T 210 50 T 310 30 T 412 10" fill="none" stroke="url(#primary-glow)" stroke-width="3.5" class="animated-chart-line" stroke-linecap="round" />

      <!-- Chart Data Points -->
      <circle cx="110" cy="70" r="4.5" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="210" cy="50" r="4.5" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" />
      <circle cx="310" cy="30" r="4.5" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" />
      
      <!-- Pulsing current active point -->
      <g transform="translate(412, 10)">
        <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.3" class="pulse-beacon" />
        <circle cx="0" cy="0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Small Floating Dynamic Sub-Card (New Followers Detected) -->
  <g class="floating-card-2" transform="translate(630, 240)">
    <rect width="210" height="74" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#30363d" stroke-width="1" filter="url(#subtle-glow)" />
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#38bdf8" fill-opacity="0.15" />
      <text x="8" y="21" font-size="14">✨</text>
      <text x="40" y="14" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">New Follower!</text>
      <text x="40" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">@octodev joined</text>
    </g>
  </g>
</svg>
